    <div class="backdrop showmoviemodel" id="backdrop"></div>
    <div class="movimodel" id="movimodel">
      <form id="movie_form">
        <div class="card">
          <div class="card-header bg-info d-flex justify-content-between">
            <h4 class="mb-0" id="form_heading">Add Movie Form</h4>
            <i class="fa-solid fa-x fa-2x showmoviemodel" role="button"></i>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label for="title_control">Title</label>
              <input
                type="text" required
                class="form-control"
                placeholder="Enter movie title"
                id="title_control"
              />
            </div>

            <div class="form-group">
              <label for="desc_control">Description</label>
              <textarea
                class="form-control"
                required
                rows="4"
                placeholder="Enter movie description"
                id="desc_control"
              ></textarea>
            </div>

            <div class="form-group">
              <label for="poster_control">Poster</label>
              <input
                type="text" required
                class="form-control"
                placeholder="Enter poster URL"
                id="poster_control"
              />
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="rating_control"> Movie Rating </label>
                <select
                  for="rating_control" required
                  class="form-control"
                  id="rating_control"
                >
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                </select>
              </div>

              <!-- <div class="form-group col-md-6">
                <label for="release_control">Release Date</label>
                <input type="date" class="form-control" id="release_control" />
              </div> -->
            </div>

            <div class="form-group">
              <label for="genre_control">Genre</label>
              <select class="form-control" id="genre_control" required>
                <option selected disabled>Select Genre</option>
                <option>Action</option>
                <option>Comedy</option>
                <option>Drama</option>
                <option>Horror</option>
                <option>Romance</option>
                <option>Thriller</option>
                <option>Sci-Fi</option>
                <option>Animation</option>
              </select>
            </div>
          </div>
          <div class="card-footer d-flex justify-content-between">
            <button type="submit" class="btn btn-primary" id="add_btn">
              <i class="fa fa-plus"></i> Add Movie
            </button>
            <button
              type="button"
              class="btn btn-warning d-none"
              id="update_btn"
            >
              Update Movies
            </button>

            <button type="reset" class="btn btn-secondary ml-2 showmoviemodel">
              Cancel
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="spinner d-none" id="spinner">
      <div class="spinner-border text-secondary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
